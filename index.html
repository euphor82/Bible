<style>
  :root{
    --ink:#22201C; --paper:#FBF9F4; --card:#FFFFFF; --gold:#A98A38; --gilt:#C0A24A;
    --muted:#6E685C; --line:#E9E3D6; --ink-soft:#3A3730; --tscale:1;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--paper);
    line-height:1.6; -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:680px;margin:0 auto}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:20;background:rgba(251,249,244,.94);
    backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;
  }
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:10px}
  .brand .ic{width:34px;height:34px;border-radius:8px;flex:0 0 auto;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .brand h1{font-family:var(--serif);font-size:20px;font-weight:700;margin:0;letter-spacing:.2px}
  .brand p{margin:0;font-size:11.5px;color:var(--muted);letter-spacing:.3px}

  .progress{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .bar{flex:1;height:6px;background:#EDE7DA;border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gilt));border-radius:99px;transition:width .35s ease}
  .progress b{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px;white-space:nowrap}

  .searchrow{position:relative;margin-bottom:10px}
  .searchrow input{
    width:100%;padding:11px 38px 11px 38px;border:1px solid var(--line);border-radius:11px;
    background:#fff;font-size:16px;color:var(--ink);outline:none;
  }
  .searchrow input:focus{border-color:var(--gilt);box-shadow:0 0 0 3px rgba(192,162,74,.16)}
  .searchrow .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
  .searchrow .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;width:26px;height:26px;display:none;align-items:center;justify-content:center;border-radius:50%}
  .searchrow.has .clr{display:flex}

  .seg{display:flex;gap:6px;margin-bottom:10px}
  .seg button{flex:1;padding:8px 0;font-size:13px;font-weight:600;color:var(--muted);border-radius:9px;border:1px solid var(--line);background:#fff;letter-spacing:.2px}
  .seg button.on{color:#fff;background:var(--ink);border-color:var(--ink)}

  .chips{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .chips button{padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink-soft);border:1px solid var(--line);border-radius:99px;background:#fff;white-space:nowrap}
  .chips button.on{background:rgba(169,138,56,.12);border-color:var(--gilt);color:#7d6624}

  /* ---------- Content ---------- */
  main{padding:6px 16px 60px}
  .tlabel{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin:22px 2px 4px}
  .tsub{font-size:12px;color:var(--muted);margin:0 2px 10px;font-style:italic}

  /* group accordion */
  .group{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:9px;overflow:hidden}
  .ghead{width:100%;display:flex;align-items:center;gap:10px;padding:14px 14px;text-align:left}
  .ghead .gname{font-family:var(--serif);font-size:calc(16.5px * var(--tscale));font-weight:700;flex:1}
  .ghead .gmeta{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .ghead .chev{color:var(--gold);font-size:13px;transition:transform .25s ease;flex:0 0 auto}
  .group.open .ghead .chev{transform:rotate(90deg)}
  .gdot{width:7px;height:7px;border-radius:50%;background:var(--gilt);flex:0 0 auto;opacity:0}
  .group.done .gdot{opacity:1}

  .gbody{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .group.open .gbody{max-height:none}

  /* book row */
  .book{border-top:1px solid var(--line)}
  .brow{width:100%;display:flex;align-items:center;gap:9px;padding:12px 14px 12px 16px;text-align:left}
  .brow .bname{font-family:var(--serif);font-size:calc(15.5px * var(--tscale));flex:1}
  .brow .badge{font-size:13px;flex:0 0 auto;line-height:1}
  .brow .badge.rib{color:var(--gold)}
  .brow .badge.rd{color:var(--gilt)}
  .brow .chev{color:#C9C2B2;font-size:12px;transition:transform .25s ease}
  .book.open .brow .chev{transform:rotate(90deg)}
  .book.read .bname{color:var(--muted)}

  .bdetail{max-height:0;overflow:hidden;transition:max-height .35s ease;background:#FFFDF8}
  .book.open .bdetail{max-height:none}
  .bpad{padding:4px 16px 18px}
  .author{font-size:calc(12.5px * var(--tscale));color:var(--muted);font-style:italic;margin:0 0 10px}
  .author b{color:var(--gold);font-style:italic}
  .summary{font-size:calc(15px * var(--tscale));margin:0 0 14px;color:var(--ink-soft)}

  .lab{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
  .verse{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin:0 0 14px}
  .verse .q{font-family:var(--serif);font-style:italic;font-size:calc(15.5px * var(--tscale));color:var(--ink-soft)}
  .verse .ref{display:block;margin-top:3px;font-size:11.5px;font-weight:700;color:var(--gold);letter-spacing:.4px}
  .block{margin:0 0 14px}
  .block p{margin:0;font-size:calc(14.5px * var(--tscale));color:var(--ink-soft)}
  .chars{list-style:none;padding:0;margin:0 0 4px}
  .chars li{position:relative;padding:3px 0 3px 16px;font-size:calc(14.5px * var(--tscale));color:var(--ink-soft)}
  .chars li::before{content:'';position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--gilt)}
  .chars li b{color:var(--ink)}

  .actions{display:flex;gap:8px;margin-top:14px}
  .actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);letter-spacing:.2px}
  .actions button.act{background:rgba(169,138,56,.13);border-color:var(--gilt);color:#7d6624}
  .navbtns{display:flex;justify-content:space-between;margin-top:12px}
  .navbtns button{font-size:12.5px;font-weight:600;color:var(--gold);padding:6px 4px}
  .navbtns button:disabled{color:#CFC8B8}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:50px 20px}
  .empty .big{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:6px}

  /* ---------- Timeline ---------- */
  .tlintro{font-size:13px;color:var(--muted);font-style:italic;margin:16px 2px 18px}
  .tl{position:relative;padding-left:26px;margin:0}
  .tl::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gilt),var(--line))}
  .era{position:relative;margin-bottom:22px}
  .era::before{content:'';position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--gold)}
  .era .d{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold)}
  .era .e{font-family:var(--serif);font-size:calc(17px * var(--tscale));font-weight:700;margin:1px 0 4px}
  .era .x{font-size:calc(14px * var(--tscale));color:var(--ink-soft);margin:0}

  /* ---------- About ---------- */
  .about h2{font-family:var(--serif);font-size:20px;margin:18px 0 10px}
  .about p{font-size:calc(14.5px * var(--tscale));color:var(--ink-soft);margin:0 0 13px}
  .about .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:6px 0 16px}
  .about .stat b{font-family:var(--serif);font-size:15px}
  .reset{width:100%;padding:11px 0;font-size:13px;font-weight:700;color:#8a3a2e;border:1px solid #E7CFC7;border-radius:10px;background:#fff}
  .tip{background:rgba(169,138,56,.09);border:1px solid #EBE0C4;border-radius:12px;padding:13px 15px;margin:4px 0 16px}
  .tip b{font-family:var(--serif)}
  .tip p{font-size:13px;color:var(--ink-soft);margin:6px 0 0}

  .foot{text-align:center;font-size:11px;color:#B7AF9E;padding:8px 0 24px}

  @media (prefers-reduced-motion: reduce){*{transition:none!important}}

  /* ---------- Gear button ---------- */
  .gear{margin-left:auto;flex:0 0 auto;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--muted);border:1px solid var(--line);background:#fff}
  .gear:active{background:var(--line)}

  /* ---------- Christ across Scripture ---------- */
  .csec{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--gold);letter-spacing:1.2px;text-transform:uppercase;margin:28px 2px 6px;padding-top:16px;border-top:1px solid var(--line)}
  .cnote{font-size:12.5px;color:var(--muted);font-style:italic;margin:0 2px 14px}
  .cbook{font-family:var(--serif);font-size:calc(16px * var(--tscale));font-weight:700;margin:16px 2px 5px;color:var(--ink)}
  .cx{list-style:none;padding:0;margin:0 0 6px}
  .cx li{position:relative;padding:4px 0 4px 16px;font-size:calc(14px * var(--tscale));color:var(--ink-soft)}
  .cx li::before{content:'';position:absolute;left:2px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--gilt)}
  .cp{font-size:calc(14px * var(--tscale));color:var(--ink-soft);margin:0 2px 8px}

  /* ---------- Settings sheet ---------- */
  .sheet{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(20,18,15,0);transition:background .22s ease}
  .sheet[hidden]{display:none}
  .sheet.show{background:rgba(20,18,15,.45)}
  .sheet .panel{background:var(--paper);border-radius:18px 18px 0 0;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(101%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:0 18px calc(env(safe-area-inset-bottom) + 26px);max-width:680px;margin:0 auto;width:100%;box-shadow:0 -12px 44px rgba(0,0,0,.28)}
  .sheet.show .panel{transform:translateY(0)}
  .shead{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:16px 2px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;z-index:2}
  .shead h2{font-family:var(--serif);font-size:19px;margin:0}
  .shead .x{font-size:26px;color:var(--muted);width:38px;height:38px;display:flex;align-items:center;justify-content:center;margin-right:-6px}
  .slabel{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold);margin:20px 2px 2px}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line)}
  .srow .lab2{font-size:14.5px;font-weight:600;color:var(--ink)}
  .srow .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .toggle{width:52px;height:30px;border-radius:99px;background:#D9D2C4;position:relative;flex:0 0 auto;transition:background .2s}
  .toggle.on{background:var(--gold)}
  .toggle i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .toggle.on i{left:25px}
  .fsizes{display:flex;gap:6px;flex:0 0 auto}
  .fsizes button{width:40px;height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink-soft);font-family:var(--serif);line-height:1;display:flex;align-items:center;justify-content:center}
  .fsizes button.on{background:rgba(169,138,56,.14);border-color:var(--gilt);color:#7d6624}
  .sbtn{width:100%;padding:13px 0;font-size:14px;font-weight:700;border-radius:11px;border:1px solid var(--gilt);background:rgba(169,138,56,.13);color:#7d6624;margin-top:10px;letter-spacing:.2px}
  .sbtn.plain{background:#fff;border-color:var(--line);color:var(--ink-soft)}
  .sbtn.danger{background:#fff;border-color:#E7CFC7;color:#8a3a2e;margin-top:16px}
  .sstat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0 2px}
  .sstat b{font-family:var(--serif);font-size:14.5px}
  .sabout h3{font-family:var(--serif);font-size:16px;margin:16px 0 8px}
  .sabout p{font-size:13.5px;color:var(--ink-soft);margin:0 0 11px}

  /* ---------- Dark theme ---------- */
  html.dark{ --ink:#ECE6D8; --paper:#17150F; --card:#221E17; --gold:#CBA94E; --gilt:#DCBE66; --muted:#9E9683; --line:#332F26; --ink-soft:#D6CFBE; }
  html.dark body{background:var(--paper)}
  html.dark header{background:rgba(23,21,15,.94)}
  html.dark .bar{background:#2A261E}
  html.dark .searchrow input{background:#221E17;border-color:var(--line);color:var(--ink)}
  html.dark .seg button{background:#221E17;border-color:var(--line)}
  html.dark .seg button.on{background:var(--gold);border-color:var(--gold);color:#17150F}
  html.dark .chips button{background:#221E17;border-color:var(--line);color:var(--ink-soft)}
  html.dark .chips button.on{background:rgba(203,169,78,.20);border-color:var(--gilt);color:var(--gilt)}
  html.dark .group{background:#201C15}
  html.dark .bdetail{background:#1B1810}
  html.dark .brow .chev{color:#6f6a5c}
  html.dark .actions button{background:#2A261E;border-color:var(--line);color:var(--ink-soft)}
  html.dark .actions button.act{background:rgba(203,169,78,.20);border-color:var(--gilt);color:var(--gilt)}
  html.dark .gear{background:#221E17;border-color:var(--line);color:var(--ink-soft)}
  html.dark .fsizes button{background:#221E17;border-color:var(--line);color:var(--ink-soft)}
  html.dark .fsizes button.on{background:rgba(203,169,78,.20);border-color:var(--gilt);color:var(--gilt)}
  html.dark .toggle{background:#3a352a}
  html.dark .toggle i{background:#EAE4D6}
  html.dark .sbtn{background:rgba(203,169,78,.16);border-color:var(--gilt);color:var(--gilt)}
  html.dark .sbtn.plain{background:#221E17;color:var(--ink-soft);border-color:var(--line)}
  html.dark .sbtn.danger{background:#221E17;border-color:#5a3a34;color:#E69A8E}
  html.dark .sstat,html.dark .about .stat{background:#221E17;border-color:var(--line)}
  html.dark .tip{background:rgba(203,169,78,.10);border-color:#4A4128}
  html.dark .reset{background:#221E17;border-color:#5a3a34;color:#E69A8E}

  /* ---------- Backup reminder ---------- */
  .reminder{display:flex;align-items:center;gap:12px;justify-content:space-between;background:rgba(169,138,56,.12);border:1px solid var(--gilt);border-radius:12px;padding:11px 13px;margin:8px 0 2px}
  .reminder[hidden]{display:none}
  .reminder .rtext{display:flex;flex-direction:column;line-height:1.35;min-width:0}
  .reminder .rtext b{font-family:var(--serif);font-size:14px;color:var(--ink)}
  .reminder .rtext span{font-size:12px;color:var(--muted)}
  .reminder .rbtns{display:flex;gap:7px;flex:0 0 auto}
  .reminder .rbtns button{padding:8px 12px;font-size:12.5px;font-weight:700;border-radius:9px;border:1px solid var(--gilt);background:var(--gold);color:#fff;white-space:nowrap}
  .reminder .rbtns button.ghost{background:#fff;color:#7d6624}
  .rsel{display:flex;gap:6px}
  .rsel button{flex:1;padding:9px 0;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink-soft)}
  .rsel button.on{background:rgba(169,138,56,.14);border-color:var(--gilt);color:#7d6624}
  html.dark .reminder{background:rgba(203,169,78,.12);border-color:#4A4128}
  html.dark .reminder .rbtns button{background:var(--gold);color:#17150F;border-color:var(--gold)}
  html.dark .reminder .rbtns button.ghost{background:#221E17;color:var(--gilt);border-color:var(--line)}
  html.dark .rsel button{background:#221E17;border-color:var(--line);color:var(--ink-soft)}
  html.dark .rsel button.on{background:rgba(203,169,78,.20);border-color:var(--gilt);color:var(--gilt)}
</style>
<script>(function(){try{var d=document.documentElement;

}catch(e){}})();</script>

<div class="wrap">
  <header>
    <div class="brand">

      <div>

<script>
const DATA = {"testaments":[{"id":"ot","title":"Old Testament","subtitle":"39 books — Creation, covenant, and the promise of a Redeemer","groups":[{"name":"The Pentateuch (The Law)","books":[{"name":"Genesis","author":"Moses (traditional attribution)","summary":"The book of origins — of the universe, humanity, sin, and God's covenant people. In the beginning God speaks creation into being and forms man and woman in His image, but Adam and Eve's disobedience fractures everything, unleashing sin, shame, and death. The story moves through Cain's murder of Abel, Noah's flood, and the scattering at Babel, then narrows to one family through whom God will bless the world. He calls Abraham and renews His promise to Isaac, Jacob, and Joseph, whose betrayal and rise in Egypt preserve the family through famine. Genesis closes with Israel dwelling in Egypt, the stage set for a nation.","verse":{"ref":"Genesis 1:1","text":"In the beginning, God created the heavens and the earth."},"point":"God is the sovereign Creator who made everything good, and though human sin corrupts it, He immediately sets in motion a plan to redeem the world through a chosen family. Every promise that follows in Scripture traces back to the covenant God makes here.","christ":"The promised offspring of the woman who will crush the serpent (3:15), and the seed of Abraham in whom all nations are blessed.","chars":[{"n":"Adam & Eve","d":"the first man and woman, made in God's image to rule creation; their choice to eat the forbidden fruit brought sin, shame, and death into the world"},{"n":"Noah","d":"a righteous man in a corrupt generation who obeyed God by building the ark, preserving his family and the animals through the flood"},{"n":"Abraham","d":"called out of Ur and promised land, descendants, and blessing for all nations; his trust in God, even in willingness to offer Isaac, made him the father of the faithful"},{"n":"Isaac","d":"the long-awaited son of promise through whom God's covenant carried on to the next generation"},{"n":"Jacob (Israel)","d":"Abraham's grandson who schemed for his brother's blessing, wrestled with God, and fathered the twelve sons who became the tribes of Israel"},{"n":"Joseph","d":"Jacob's favored son, sold into Egyptian slavery by jealous brothers, who rose to become Pharaoh's second-in-command and saved his family, seeing God's good purpose in their evil"}]},{"name":"Exodus","author":"Moses (traditional attribution)","summary":"God rescues Israel from centuries of slavery in Egypt and forges them into His covenant nation. Through Moses He confronts Pharaoh with ten devastating plagues, institutes the Passover, and parts the Red Sea to lead the people out on dry ground. At Mount Sinai He gives the Ten Commandments and the Law, revealing how His redeemed people are to live. He then provides detailed instructions for the tabernacle, the portable tent where His glory will dwell in the midst of Israel.","verse":{"ref":"Exodus 6:7","text":"I will take you to be my people, and I will be your God."},"point":"God hears His people's cry and redeems them from bondage by His mighty hand, binding Himself to them by covenant. He rescues them not merely to free them from slavery but to dwell among them as their God.","christ":"The Passover Lamb whose blood shields from death, and the deliverer who leads His people out of slavery.","chars":[{"n":"Moses","d":"raised in Pharaoh's palace, then called from a burning bush to confront Egypt and lead Israel out; he received the Law at Sinai and mediated between God and the people"},{"n":"Aaron","d":"Moses' older brother and spokesman before Pharaoh, later consecrated as Israel's first high priest, though he faltered by making the golden calf"},{"n":"Pharaoh","d":"the king of Egypt who repeatedly hardened his heart against God's demand to release Israel, bringing plague after plague on his nation"},{"n":"Miriam","d":"Moses' sister, a prophetess who watched over him as a baby and led the women in a song of victory after the Red Sea crossing"}]},{"name":"Leviticus","author":"Moses (traditional attribution)","summary":"A manual of holiness given at Sinai, teaching a redeemed people how to live in the presence of a holy God. It lays out the sacrificial system, the ordination and duties of the priests, and laws about purity, food, disease, and daily life. At its center stand the Day of Atonement and the annual festivals that shaped Israel's worship. The recurring call, \"Be holy, for I am holy,\" runs through every regulation.","verse":{"ref":"Leviticus 19:2","text":"You shall be holy, for I the Lord your God am holy."},"point":"A holy God graciously provides a way for sinful people to approach Him — through sacrifice, atonement, and set-apart living. Holiness is not earned but is the fitting response of a people God has claimed as His own.","christ":"The spotless, once-for-all sacrifice and the great High Priest who makes atonement for sin.","chars":[{"n":"Moses","d":"received the detailed laws of worship and sacrifice from God and delivered them to Israel"},{"n":"Aaron & his sons","d":"set apart as Israel's priests to offer sacrifices, guard holiness, and mediate between God and the people"},{"n":"Nadab & Abihu","d":"Aaron's sons who offered \"unauthorized fire\" before the Lord in presumption and were struck dead, a sober warning that God must be approached on His terms"}]},{"name":"Numbers","author":"Moses (traditional attribution)","summary":"Named for the two censuses that frame it, Numbers follows Israel through forty years in the wilderness between Sinai and the Promised Land. Poised to enter Canaan, the people believe the ten fearful spies over Joshua and Caleb and refuse to trust God, so that entire generation is condemned to die in the desert. The book records repeated grumbling, rebellion, and plague, alongside God's faithful provision of manna, water, and guidance. At last a new generation prepares to take the land.","verse":{"ref":"Numbers 6:24","text":"The Lord bless you and keep you."},"point":"Unbelief and disobedience carry real consequences, costing a whole generation the promise they were offered. Yet even amid Israel's failures, God patiently provides, disciplines, and remains faithful to His covenant.","christ":"The bronze serpent lifted up so that all who look may live (John 3:14), and the rock that gives living water.","chars":[{"n":"Moses","d":"continued to lead and intercede for a chronically rebellious people, though his own angry striking of the rock barred him from the land"},{"n":"Joshua & Caleb","d":"the two spies who urged Israel to trust God and take the land, and alone of their generation were promised they would enter it"},{"n":"Balaam","d":"a pagan prophet hired to curse Israel who could only bless them, and whose donkey spoke to rebuke his folly"},{"n":"Korah","d":"a Levite who led a rebellion challenging Moses' and Aaron's leadership and was swallowed alive when the ground opened beneath him"}]},{"name":"Deuteronomy","author":"Moses (traditional attribution)","summary":"On the plains of Moab, at the edge of the Promised Land, Moses delivers his farewell sermons to a new generation. He rehearses their history, restates the Law, and calls them to love the Lord wholeheartedly and obey Him in the land they are about to enter. He sets before them blessing and curse, life and death, and pleads, \"Choose life.\" After commissioning Joshua and blessing the tribes, Moses climbs Mount Nebo, sees the land, and dies.","verse":{"ref":"Deuteronomy 6:5","text":"You shall love the Lord your God with all your heart."},"point":"God's Law is meant to be obeyed not as cold duty but out of grateful love for the God who redeemed His people. Wholehearted devotion brings life and blessing, and each new generation must renew that covenant for itself.","christ":"The Prophet greater than Moses whom God promised to raise up and to whom we must listen (18:15).","chars":[{"n":"Moses","d":"delivered his final, impassioned speeches urging love and obedience, then died on Mount Nebo within sight of the land he could not enter"},{"n":"Joshua","d":"publicly commissioned and encouraged as Moses' successor to lead Israel into Canaan"}]}]},{"name":"The Historical Books","books":[{"name":"Joshua","author":"Joshua (traditional; the book is anonymous)","summary":"With Moses gone, Joshua leads Israel across the Jordan to take possession of the Promised Land. God dries up the river, the walls of Jericho collapse, and through a series of campaigns the major Canaanite strongholds fall. The conquered land is then divided by lot among the twelve tribes as their inheritance. Joshua ends his life gathering the people to renew the covenant and choose whom they will serve.","verse":{"ref":"Joshua 1:9","text":"Be strong and courageous… the Lord your God is with you."},"point":"God is faithful to keep every promise He makes, giving His people the inheritance He pledged to their fathers. Their part is to trust and obey Him wholeheartedly, for the victory comes from Him and not their own strength.","christ":"Jesus, who shares Joshua's name, leads His people into their true inheritance and rest.","chars":[{"n":"Joshua","d":"Moses' successor, a man of courage and faith who led the conquest, divided the land, and charged Israel to serve the Lord alone"},{"n":"Rahab","d":"a Canaanite woman in Jericho who hid the Israelite spies and confessed faith in their God; she was spared and became an ancestor of Christ"},{"n":"Achan","d":"a soldier who secretly kept plunder devoted to God, bringing defeat and judgment on Israel until his sin was exposed"},{"n":"Caleb","d":"one of the two faithful spies, who at eighty-five boldly claimed the hill country God had promised him"}]},{"name":"Judges","author":"Samuel (traditional; the book is anonymous)","summary":"After Joshua's generation dies, Israel spirals into a grim, repeating cycle: they abandon God for idols, fall under enemy oppression, cry out in distress, and are rescued by a \"judge\" God raises up — only to fall away again. The deliverers grow increasingly flawed, and the nation sinks into moral chaos. The book's refrain, \"everyone did what was right in his own eyes,\" names the root problem. It is a dark stretch of Israel's story crying out for a true and righteous king.","verse":{"ref":"Judges 21:25","text":"Everyone did what was right in his own eyes."},"point":"When people reject God as their true king, they descend into idolatry and chaos, each doing what seems right in their own eyes. Yet God mercifully keeps raising up deliverers, showing His patience with a people who don't deserve it.","christ":"The perfect Judge and Deliverer who saves once for all, unlike the flawed rescuers of the era.","chars":[{"n":"Deborah","d":"a prophetess and the only female judge, who summoned Barak and led Israel to a decisive victory over the Canaanite commander Sisera"},{"n":"Gideon","d":"a hesitant farmer who, after asking God for signs, routed the vast Midianite army with only three hundred men, torches, and trumpets"},{"n":"Samson","d":"a Nazirite of extraordinary strength and reckless appetite whose weakness for Delilah led to his capture, but who toppled the Philistine temple in his death"},{"n":"Delilah","d":"the Philistine woman who coaxed the secret of Samson's strength from him and betrayed him for silver"}]},{"name":"Ruth","author":"Samuel (traditional; the book is anonymous)","summary":"Set in the turbulent era of the judges, Ruth tells a quiet, hopeful story of loyalty and redemption. After famine and the deaths of her husband and sons, the widow Naomi returns to Bethlehem, and her Moabite daughter-in-law Ruth refuses to leave her side. Gleaning in the fields to survive, Ruth catches the eye of Boaz, a wealthy relative who acts as her kinsman-redeemer and marries her. Their son Obed becomes the grandfather of King David, placing this humble family in the line of the Messiah.","verse":{"ref":"Ruth 1:16","text":"Your people shall be my people, and your God my God."},"point":"God works through ordinary faithfulness and loyal love to redeem broken situations and accomplish His grand purposes. Even a foreign widow finds a place among His people — and in the family line of the coming King.","christ":"The kinsman-redeemer, pictured in Boaz, who pays the price to claim His bride.","chars":[{"n":"Ruth","d":"a Moabite widow whose famous pledge of loyalty to Naomi, and to Naomi's God, led her to become the great-grandmother of King David"},{"n":"Naomi","d":"an Israelite widow who returned home empty and bitter after great loss, but was restored through Ruth's devotion and Boaz's kindness"},{"n":"Boaz","d":"a godly landowner who redeemed Ruth by marrying her, a living picture of the kinsman-redeemer that points to Christ"}]},{"name":"1 Samuel","author":"Anonymous (traditionally Samuel, Nathan, and Gad)","summary":"Israel moves from the age of judges to the age of kings. The prophet Samuel, given to God as a boy, anoints Saul as Israel's first king in response to the people's demand. When Saul repeatedly disobeys God, he is rejected, and Samuel secretly anoints the shepherd boy David. David kills the giant Goliath and rises in popularity, provoking the jealous Saul to hunt him relentlessly across the wilderness. The book traces the tragic decline of one king and the patient making of another.","verse":{"ref":"1 Samuel 16:7","text":"The Lord looks on the heart."},"point":"God, not a human monarch, is Israel's true King, and He looks past outward appearance to the heart. He humbles the proud and self-willed while raising up the humble and faithful for His purposes.","christ":"The true anointed King after God's own heart, foreshadowed by the shepherd David.","chars":[{"n":"Samuel","d":"the last judge and a faithful prophet who anointed Israel's first two kings and called the nation back to God"},{"n":"Saul","d":"Israel's tall, impressive first king whose disobedience, jealousy, and fear led to his rejection by God and a long downward spiral"},{"n":"David","d":"the young shepherd anointed as future king, whose faith felled Goliath and whose patience spared Saul even while being hunted"},{"n":"Goliath","d":"the towering Philistine champion whose taunts were silenced by David's sling and faith in God"},{"n":"Jonathan","d":"Saul's noble son and David's loyal friend, who protected David even though it cost him the throne"}]},{"name":"2 Samuel","author":"Anonymous (traditionally attributed to the same prophetic sources)","summary":"This book chronicles the reign of David, Israel's greatest king, in both its glory and its grief. David unites the tribes, captures Jerusalem, brings the ark to the city, and receives God's covenant promise that his throne will endure forever. But at the height of his power, his adultery with Bathsheba and the murder of her husband unleash a chain of tragedy — betrayal, rebellion, and death — within his own family. Through it all David remains a man after God's heart, repentant and dependent on grace even in his failures.","verse":{"ref":"2 Samuel 7:16","text":"Your throne shall be established forever."},"point":"God graciously establishes an everlasting dynasty through David, a promise ultimately fulfilled in Christ. Yet even a great king's sin brings devastating consequences, showing that no one stands above accountability to God.","christ":"The Son of David whose throne, promised forever, is established in Christ the eternal King.","chars":[{"n":"David","d":"the shepherd-king who united Israel and received God's eternal covenant, yet whose sin with Bathsheba brought lasting turmoil; still he repented and remained devoted to God"},{"n":"Bathsheba","d":"the woman David took in adultery, whose husband he had killed; she later became the mother of Solomon"},{"n":"Nathan","d":"the fearless prophet who confronted David with the parable of the ewe lamb and led the king to repentance"},{"n":"Absalom","d":"David's handsome, ambitious son who murdered his brother, stole the people's loyalty, and led a rebellion that ended in his own death"}]},{"name":"1 Kings","author":"Anonymous (traditionally Jeremiah)","summary":"Solomon succeeds David, and under his rule Israel reaches its golden age — he asks God for wisdom, builds the magnificent temple, and enjoys unmatched wealth and renown. But his many foreign wives lure him into idolatry, and after his death the kingdom splits: ten tribes form the northern kingdom of Israel, and Judah remains in the south. A succession of mostly wicked kings follows. Into this decline steps the prophet Elijah, who confronts King Ahab and the prophets of Baal in a dramatic showdown on Mount Carmel.","verse":{"ref":"1 Kings 18:21","text":"How long will you go limping between two opinions?"},"point":"Wisdom and blessing flow from devotion to God, but idolatry corrodes and divides even the greatest kingdom. When kings fail, God still preserves His word and His people through faithful prophets.","christ":"The one greater than Solomon — the true King, wisdom, and temple of God.","chars":[{"n":"Solomon","d":"David's son who asked God for wisdom and built the temple, reigning in unmatched splendor before his idolatry set the kingdom's decline in motion"},{"n":"Elijah","d":"a bold prophet who defied King Ahab, called down fire on Mount Carmel, and defeated the prophets of Baal"},{"n":"Ahab","d":"a weak and wicked king of Israel who promoted Baal worship under his wife's influence"},{"n":"Jezebel","d":"Ahab's foreign queen, who aggressively pushed Baal worship and murdered the prophets of God"}]},{"name":"2 Kings","author":"Anonymous (traditionally Jeremiah)","summary":"The story of the divided kingdom continues its long slide toward ruin. Prophets like Elisha work miracles and warn the people, but king after king leads them into idolatry and injustice. The northern kingdom of Israel is finally conquered and deported by Assyria, and generations later Judah falls to Babylon, with Jerusalem and the temple destroyed. Only a handful of reforming kings, like Hezekiah and Josiah, briefly stem the tide before the exile.","verse":{"ref":"2 Kings 17:13","text":"Turn from your evil ways."},"point":"Persistent, unrepentant sin brings the judgment God's prophets long warned about, and even His covenant people are not exempt. Yet the book leaves a thread of hope, for God's purposes and His promise to David are not finished.","christ":"The faithful Prophet and King who never fails where earthly kings fell into sin.","chars":[{"n":"Elisha","d":"Elijah's successor, who received a double portion of his spirit and performed many miracles of healing and provision"},{"n":"Hezekiah","d":"a faithful king of Judah who trusted God, saw Jerusalem delivered from Assyria, and was granted added years of life"},{"n":"Josiah","d":"a young reforming king who rediscovered the Book of the Law, tore down idols, and led the nation in renewed covenant"},{"n":"Naaman","d":"an Aramean army commander healed of leprosy after humbling himself to wash in the Jordan at Elisha's word"}]},{"name":"1 Chronicles","author":"Anonymous (traditionally Ezra, “the Chronicler”)","summary":"Written for the community returning from exile, Chronicles retells Israel's story with a priestly focus on worship and God's covenant. It opens with genealogies from Adam through the tribes, anchoring the people's identity, then centers on the reign of David. It highlights his heart for God, his organizing of the temple worship and the Levites, and his extensive preparations for the temple Solomon would build. The past is recounted to give a discouraged people hope and direction.","verse":{"ref":"1 Chronicles 16:34","text":"Give thanks to the Lord, for he is good."},"point":"God's covenant with David and the worship of the true God stand at the heart of Israel's identity and future. Remembering God's faithfulness in the past gives a struggling people confidence for the days ahead.","christ":"The everlasting King of David's line, at the center of God's true worship.","chars":[{"n":"David","d":"the central figure, portrayed above all as a worshiper who organized Israel's praise and prepared everything for the temple"},{"n":"Solomon","d":"David's chosen successor, set apart to build the house of God"}]},{"name":"2 Chronicles","author":"Anonymous (traditionally Ezra, “the Chronicler”)","summary":"Picking up with Solomon, this book follows the kings of Judah from the temple's glorious dedication to its tragic destruction. It highlights the reigns of faithful, reforming kings and the revivals they led, while tracing the nation's repeated drift into idolatry. The temple and true worship remain the recurring measure of the people's faithfulness. It ends with the fall of Jerusalem, but also the decree of Cyrus permitting the exiles to return and rebuild.","verse":{"ref":"2 Chronicles 7:14","text":"If my people… humble themselves… I will heal their land."},"point":"Wholehearted worship and humble repentance open the way to God's blessing and restoration. Even after judgment falls, God keeps His promise and makes a way for His people to return home.","christ":"The true and greater temple, where God comes to dwell with His people.","chars":[{"n":"Solomon","d":"built and dedicated the temple, where God's glory came to dwell among His people"},{"n":"Hezekiah & Josiah","d":"reforming kings of Judah who cleansed the temple, restored true worship, and led the people back to God"}]},{"name":"Ezra","author":"Ezra (traditional attribution)","summary":"After decades in Babylonian exile, the Jews are permitted to return home under Persian decree. In two waves — first under Zerubbabel and later under Ezra — they rebuild the temple in Jerusalem despite opposition and discouragement. Ezra, a priest and scholar of the Law, arrives to teach God's Word and lead the people in spiritual reform, confronting compromise such as intermarriage with pagan nations. The book shows God restoring not only a building but the devotion of His people.","verse":{"ref":"Ezra 7:10","text":"Ezra had set his heart to study the Law of the Lord."},"point":"God is faithful to restore His people from exile, keeping His promises across the generations. True renewal rebuilds not just walls and temples but hearts committed to His Word.","christ":"The one who restores and rebuilds His people, renewing them by His Word.","chars":[{"n":"Ezra","d":"a priest and scribe devoted to studying, obeying, and teaching the Law, who led the returned exiles in spiritual reform"},{"n":"Zerubbabel","d":"the governor who led the first return and oversaw the rebuilding of the temple"},{"n":"Cyrus","d":"the Persian king whose decree, foretold by Isaiah, freed the Jewish exiles to return and rebuild"}]},{"name":"Nehemiah","author":"Nehemiah (his memoirs; traditional attribution)","summary":"Nehemiah, a Jewish cupbearer to the Persian king, is heartbroken to learn Jerusalem's walls still lie in ruins. Granted permission to return, he rallies the people and rebuilds the walls in just fifty-two days, overcoming ridicule, threats, and internal discouragement through prayer and determined leadership. With the city secure, Ezra reads the Law aloud, the people confess their sins, and the community renews its covenant with God. Nehemiah then works to reform ongoing compromises among the people.","verse":{"ref":"Nehemiah 8:10","text":"The joy of the Lord is your strength."},"point":"With prayer, courage, and dependence on God, His people can rebuild what sin and neglect have torn down. Genuine restoration pairs practical work with spiritual renewal and covenant faithfulness.","christ":"The restorer who rebuilds what sin has broken down and secures His people.","chars":[{"n":"Nehemiah","d":"a praying, practical leader who rebuilt Jerusalem's walls against fierce opposition and governed the people with integrity and reform"},{"n":"Ezra","d":"the scribe who read and explained the Law to the assembled people, sparking confession and renewal"},{"n":"Sanballat & Tobiah","d":"regional officials who mocked, schemed, and threatened to stop the rebuilding of the walls"}]},{"name":"Esther","author":"Anonymous (traditionally Mordecai)","summary":"In the Persian empire, a Jewish orphan named Esther is chosen as queen, concealing her heritage. When the royal official Haman plots to annihilate all the Jews, Esther's cousin Mordecai urges her to intervene, and she risks her life by approaching the king uninvited. Through a series of remarkable reversals, Haman is hanged on the very gallows he built, and the Jews are delivered. God's name never appears in the book, yet His providence directs every turn, and the feast of Purim is established to remember it.","verse":{"ref":"Esther 4:14","text":"…for such a time as this."},"point":"Even when God seems hidden and unnamed, His providence is at work protecting His people and overturning the schemes of their enemies. He positions the faithful \"for such a time as this\" to act with courage.","christ":"The unseen providence that rescues His people, and the advocate who saves at the risk of His own life.","chars":[{"n":"Esther","d":"a Jewish orphan who became queen of Persia and courageously risked her life to expose Haman's plot and save her people"},{"n":"Mordecai","d":"Esther's cousin and guardian, who uncovered a plot against the king and urged Esther to act for her people's rescue"},{"n":"Haman","d":"the king's proud official whose hatred of Mordecai grew into a plot to destroy all the Jews, and who died on his own gallows"},{"n":"King Ahasuerus","d":"the powerful but easily swayed Persian king (Xerxes) whose decrees drove the drama"}]}]},{"name":"The Books of Wisdom & Poetry","books":[{"name":"Job","author":"Anonymous (author unknown)","summary":"Job, a blameless and prosperous man, becomes the subject of a heavenly test when Satan claims he serves God only for the blessings. In a single day Job loses his wealth, his children, and his health, yet refuses to curse God. Three friends arrive and insist his suffering must be punishment for hidden sin, sparking long, searching dialogues about why the righteous suffer. In the end God speaks from the whirlwind — not explaining, but revealing His majesty and wisdom — and Job, humbled and trusting, is restored.","verse":{"ref":"Job 19:25","text":"I know that my Redeemer lives."},"point":"God is sovereign, wise, and trustworthy even when suffering makes no sense and no answers come. Faith clings to God for who He is, not merely for the blessings He gives.","christ":"The living Redeemer (19:25) and the Mediator who stands between God and suffering man.","chars":[{"n":"Job","d":"a righteous man who lost everything yet refused to abandon God, wrestling honestly with his pain until he met God face to face"},{"n":"Eliphaz, Bildad & Zophar","d":"Job's three friends who wrongly insisted his suffering must be the result of sin, and were rebuked by God"},{"n":"Elihu","d":"a younger man who spoke last, rebuking both Job and his friends and pointing to God's greatness"},{"n":"Satan","d":"the accuser who challenged Job's motives and was permitted to test him within God's limits"}]},{"name":"Psalms","author":"David and others (a collection of many authors)","summary":"The Psalms are Israel's inspired songbook and prayer book, 150 poems spanning the full range of human experience before God. There are hymns of exuberant praise, gut-wrenching laments, prayers of repentance, songs of quiet trust, and celebrations of God's Word and kingship. Written across centuries by David, Asaph, the sons of Korah, and others, they give voice to joy, fear, anger, grief, and hope. Many also point forward to the Messiah — His suffering, His resurrection, and His reign.","verse":{"ref":"Psalm 23:1","text":"The Lord is my shepherd; I shall not want."},"point":"God welcomes His people to bring their whole hearts to Him — praise and pain, doubt and delight — with complete honesty. In every season, the Psalms teach us to turn toward God rather than away from Him.","christ":"The suffering and reigning Messiah — crucified in Psalm 22, enthroned in Psalm 110, the anointed Son of Psalm 2.","chars":[{"n":"David","d":"Israel's shepherd-king and the chief psalmist, who poured out his triumphs, failures, and faith in song"},{"n":"Asaph & the sons of Korah","d":"Levitical worship leaders who composed many of the temple psalms"},{"n":"Moses & Solomon","d":"each credited with individual psalms reflecting on God's eternity and kingship"}]},{"name":"Proverbs","author":"Solomon (primary), with Agur and Lemuel","summary":"Proverbs gathers the practical wisdom of Solomon and other sages into memorable sayings for skillful living. It addresses everyday matters — speech, work, money, friendship, honesty, self-control, and relationships — always grounding true wisdom in \"the fear of the Lord.\" Wisdom and Folly are personified as two women calling out to the young, each offering a path with very different ends. The book trains its readers to align daily choices with God's design for a flourishing life.","verse":{"ref":"Proverbs 1:7","text":"The fear of the Lord is the beginning of knowledge."},"point":"Real wisdom begins with reverence for God and works itself out in the practical, everyday choices of life. Skillful, godly living is learned, and the fear of the Lord is where it starts.","christ":"The very wisdom of God, who has become our wisdom, righteousness, and redemption.","chars":[{"n":"Solomon","d":"Israel's wisest king and the principal author, who collected and composed these sayings for instruction in godly living"},{"n":"Lady Wisdom & Folly","d":"two women personifying wisdom and foolishness, each inviting the reader down a path with opposite destinations"},{"n":"Agur & King Lemuel","d":"additional voices whose sayings, including the portrait of the virtuous woman, close the book"}]},{"name":"Ecclesiastes","author":"“The Preacher” (Qoheleth), traditionally Solomon","summary":"The Preacher sets out to find meaning by testing everything \"under the sun\" — pleasure, wealth, achievement, work, and even wisdom itself. Again and again he concludes that these pursuits, chased apart from God, are \"vanity,\" fleeting as a breath and unable to satisfy. He faces honestly the limits of human effort and the certainty of death. His hard-won conclusion is to enjoy God's simple gifts, fear God, and keep His commandments.","verse":{"ref":"Ecclesiastes 12:13","text":"Fear God and keep his commandments; this is the whole duty of man."},"point":"Life pursued apart from God is empty and fleeting, no matter how much we accumulate or achieve. Lasting meaning is found only in reverent trust in God and gratitude for the gifts He gives.","christ":"The one who gives lasting meaning that nothing “under the sun” can supply.","chars":[{"n":"The Preacher (Qoheleth)","d":"the reflective teacher, traditionally Solomon, who searched every avenue for meaning and found it only in God"}]},{"name":"Song of Solomon","author":"Solomon","summary":"This collection of love poetry celebrates the beauty and passion of romantic love between a bride and her beloved. Through vivid, tender imagery, it portrays longing, courtship, delight, and the covenant commitment of marriage. It affirms that marital love and desire are good gifts of God, not something to be ashamed of. Many readers also see in it a picture of the love between God and His people, or Christ and His church.","verse":{"ref":"Song of Solomon 8:6","text":"Love is strong as death."},"point":"Romantic love and desire within marriage are good and beautiful gifts from God, worthy of celebration. At a deeper level, this devoted love echoes God's covenant love for His people.","christ":"The Bridegroom who loves and delights in His bride, the church.","chars":[{"n":"The Beloved (bride)","d":"the young woman, often called the Shulammite, who expresses her love and longing for her beloved"},{"n":"The Lover (bridegroom)","d":"her beloved, traditionally Solomon, who praises and delights in his bride"}]}]},{"name":"The Major Prophets","books":[{"name":"Isaiah","author":"Isaiah, son of Amoz","summary":"Often called \"the gospel prophet,\" Isaiah ministers to Judah as Assyria threatens and judgment looms. He warns of coming punishment for the nation's sin, idolatry, and injustice, but his message soars into some of Scripture's most glorious promises. He foretells the virgin-born Immanuel, the Prince of Peace, and above all the Suffering Servant of chapter 53 who bears His people's sins. The book ends looking beyond exile to comfort, restoration, and a renewed creation.","verse":{"ref":"Isaiah 53:5","text":"With his wounds we are healed."},"point":"God will surely judge sin, but He will also save His people through a promised Messiah — the Suffering Servant and reigning King. Beyond judgment lies comfort, redemption, and the hope of a new creation.","christ":"Immanuel (7:14), the Prince of Peace (9:6), and the Suffering Servant pierced for our sins (ch. 53).","chars":[{"n":"Isaiah","d":"the prophet who saw the exalted, holy Lord in the temple and was sent to warn and comfort Judah with visions of the Messiah"},{"n":"King Hezekiah","d":"the faithful king whom Isaiah counseled and who saw God deliver Jerusalem from Assyria"},{"n":"King Ahaz","d":"Hezekiah's faithless father, who refused God's offered sign and trusted foreign powers instead"}]},{"name":"Jeremiah","author":"Jeremiah (with his scribe Baruch)","summary":"Known as \"the weeping prophet,\" Jeremiah pleads with Judah for forty years to turn back to God before Babylon destroys them. He is mocked, beaten, imprisoned, and thrown into a muddy cistern, yet keeps faithfully delivering God's word. He warns that judgment is certain and even counsels submission to Babylon, earning charges of treason. But amid the gloom he promises a glorious future — a \"new covenant\" that God will write on His people's hearts.","verse":{"ref":"Jeremiah 29:11","text":"I know the plans I have for you, declares the Lord."},"point":"God's patience has limits, and stubborn sin leads to certain judgment despite every warning. Yet beyond judgment God promises a new covenant of inward transformation and restored relationship.","christ":"The righteous Branch and the Mediator of the new covenant written on the heart (31:31).","chars":[{"n":"Jeremiah","d":"the sorrowful, persecuted prophet who faithfully warned Judah of exile for decades despite rejection and suffering"},{"n":"Baruch","d":"Jeremiah's loyal scribe who recorded and preserved his prophecies, even after a king burned the scroll"},{"n":"King Zedekiah","d":"Judah's last king, who secretly sought Jeremiah's counsel but lacked the courage to obey it"}]},{"name":"Lamentations","author":"Jeremiah (traditional attribution)","summary":"Written in the smoking ruins of Jerusalem, Lamentations is a series of five funeral poems mourning the city's fall to Babylon. With raw, unflinching grief it laments the devastation, the suffering, and the reality that this judgment came from God because of the nation's sin. Yet at its very center, hope breaks through: God's mercies are new every morning and His faithfulness is great. It teaches God's people how to grieve honestly while still clinging to Him.","verse":{"ref":"Lamentations 3:22–23","text":"His mercies… are new every morning; great is your faithfulness."},"point":"Even in the depths of deserved judgment and overwhelming grief, God's steadfast love and faithfulness endure. Honest lament and enduring hope can, and must, be held together.","christ":"The Man of Sorrows who weeps over the city, whose mercies are new every morning.","chars":[{"n":"Jeremiah","d":"the grieving prophet who gave voice to the nation's sorrow over the fall of Jerusalem"},{"n":"Daughter Zion","d":"Jerusalem personified as a devastated, weeping woman mourning her losses"}]},{"name":"Ezekiel","author":"Ezekiel the priest","summary":"A priest exiled to Babylon, Ezekiel is called to prophesy to his fellow captives through startling visions and dramatic sign-acts. He witnesses God's glory departing the defiled temple, and later returning, and enacts the coming siege of Jerusalem in vivid object lessons. His famous vision of a valley of dry bones coming to life pictures the resurrection and renewal of God's people. He promises that God will give them a new heart and a new spirit and dwell among them again.","verse":{"ref":"Ezekiel 36:26","text":"I will give you a new heart, and a new spirit."},"point":"God's glory cannot coexist with unrepentant sin, yet He promises to renew His people from the inside out. He will replace their hearts of stone with hearts of flesh and dwell among them once more.","christ":"The Good Shepherd who seeks the lost and gives His people a new heart and spirit (ch. 34, 36).","chars":[{"n":"Ezekiel","d":"the priest-prophet among the exiles who delivered vivid visions and dramatic sign-acts to warn and comfort them"},{"n":"The exiles","d":"the displaced people of Judah in Babylon, to whom Ezekiel was sent with both warning and hope"}]},{"name":"Daniel","author":"Daniel (traditional attribution)","summary":"Taken captive to Babylon as a young man, Daniel rises to prominence while refusing to compromise his faith. He and his three friends survive the fiery furnace and the lions' den, and Daniel interprets the dreams and visions of pagan kings, humbling the proud and pointing to the God of heaven. The book's second half records Daniel's own sweeping apocalyptic visions of successive world empires. Through it all runs the assurance that God reigns over history and will establish a kingdom that lasts forever.","verse":{"ref":"Daniel 2:44","text":"The God of heaven will set up a kingdom that shall never be destroyed."},"point":"God is sovereign over every human empire and the whole sweep of history, raising up and bringing down kings. His people can stay faithful under pressure, confident that His everlasting kingdom will prevail.","christ":"The Son of Man given an everlasting kingdom (7:13–14), and the fourth man in the fire.","chars":[{"n":"Daniel","d":"a wise and faithful exile who interpreted royal dreams, refused to compromise, was saved from the lions, and received visions of the future"},{"n":"Shadrach, Meshach & Abednego","d":"Daniel's three friends who refused to bow to an idol and emerged unharmed from the blazing furnace"},{"n":"Nebuchadnezzar","d":"the proud Babylonian king whom God humbled until he acknowledged the Most High"},{"n":"Belshazzar","d":"the king who saw the mysterious writing on the wall and fell that very night"}]}]},{"name":"The Minor Prophets","books":[{"name":"Hosea","author":"Hosea","summary":"God gives Hosea a painful, living sermon: marry Gomer, a woman who will prove unfaithful to him. Hosea's heartbreak over his wandering wife mirrors God's own anguish over Israel's spiritual adultery with idols. Again and again the prophet declares both God's grief and His judgment — yet also His refusal to give His people up. In a stunning act of grace, Hosea buys back his adulterous wife, picturing God's redeeming love.","verse":{"ref":"Hosea 6:6","text":"I desire steadfast love and not sacrifice."},"point":"Israel's idolatry is spiritual adultery that wounds the very heart of God, and it brings real judgment. Yet God's love is relentless — He keeps pursuing and redeeming an unfaithful people.","christ":"The faithful husband who redeems an unfaithful bride; “Out of Egypt I called my son” (11:1).","chars":[{"n":"Hosea","d":"the prophet whose own painful marriage became a living picture of God's faithful love for unfaithful Israel"},{"n":"Gomer","d":"Hosea's unfaithful wife, whom he redeemed and took back, embodying Israel's waywardness and God's grace"}]},{"name":"Joel","author":"Joel","summary":"A catastrophic locust plague devastates the land, and Joel reads it as a warning of the far greater \"day of the Lord\" to come. He calls the whole nation — young and old, priest and people — to urgent repentance, fasting, and returning to God with all their hearts. God promises to restore what the locusts have eaten and to relent from disaster for a repentant people. Looking further ahead, He promises to pour out His Spirit on all flesh, a prophecy fulfilled at Pentecost.","verse":{"ref":"Joel 2:28","text":"I will pour out my Spirit on all flesh."},"point":"Present crises are wake-up calls to repent before the coming day of the Lord. God is gracious to restore the repentant, and He promises to pour out His Spirit on all His people.","christ":"The one who pours out the Holy Spirit on all flesh, fulfilled at Pentecost.","chars":[{"n":"Joel","d":"the prophet who summoned Judah to repentance in light of the day of the Lord and foretold the outpouring of God's Spirit"}]},{"name":"Amos","author":"Amos","summary":"Amos, a shepherd and fig-farmer from Judah, is sent north to prosperous Israel with a message of judgment. He denounces the wealthy for trampling the poor, cheating in business, and indulging in luxury while ignoring injustice. He exposes their religion as hollow, since their rituals mask oppression and greed. His thundering call — \"let justice roll down like waters\" — insists that true worship is inseparable from righteousness and mercy.","verse":{"ref":"Amos 5:24","text":"Let justice roll down like waters."},"point":"God rejects religious ritual that coexists with injustice and neglect of the poor. Genuine faith produces justice, mercy, and righteousness in how we treat others.","christ":"The one who raises up the fallen tent of David and restores it (9:11).","chars":[{"n":"Amos","d":"a humble shepherd-prophet from Judah who boldly confronted the injustice and empty religion of prosperous Israel"},{"n":"Amaziah","d":"a royal priest who opposed Amos and tried to silence and expel him"}]},{"name":"Obadiah","author":"Obadiah","summary":"The shortest book in the Old Testament delivers a single, focused message of judgment against Edom. The Edomites, descendants of Esau, had gloated over Jerusalem's downfall and even helped its enemies. Obadiah declares that their pride and cruelty will bring God's justice upon them, and the proud will be brought low. He ends with the assurance that deliverance and the kingdom ultimately belong to the Lord.","verse":{"ref":"Obadiah 1:15","text":"As you have done, it shall be done to you."},"point":"God humbles the proud and holds nations accountable for how they treat His people. Those who gloat over others' downfall will face His justice, for the kingdom belongs to Him.","christ":"The Deliverer on Mount Zion, whose is the coming kingdom.","chars":[{"n":"Obadiah","d":"the prophet who pronounced God's judgment on Edom's pride and cruelty"},{"n":"Edom","d":"the neighboring nation, descended from Esau, condemned for gloating over Jerusalem's fall"}]},{"name":"Jonah","author":"Jonah (traditional; the narrative is anonymous)","summary":"God commands the prophet Jonah to preach to Nineveh, the brutal capital of Israel's enemy Assyria — and Jonah flees in the opposite direction. A violent storm and a great fish intercept him, and from the fish's belly he prays and repents. Delivered onto dry land, he finally goes and preaches, and to his dismay the entire city repents and is spared. The book ends with God gently rebuking Jonah's anger, teaching that His compassion extends even to enemies.","verse":{"ref":"Jonah 2:9","text":"Salvation belongs to the Lord!"},"point":"God's mercy reaches beyond His people to even their worst enemies, and He desires their repentance, not their ruin. His compassion is far wider than our prejudices, and He calls us to share His heart for the lost.","christ":"The sign of Jonah — three days in the grave, then risen (Matthew 12:40).","chars":[{"n":"Jonah","d":"the reluctant, resentful prophet who fled God's call, was swallowed by a great fish, and grudgingly preached to Nineveh"},{"n":"The Ninevites","d":"the wicked enemy city that unexpectedly repented at Jonah's preaching and was spared"},{"n":"The sailors","d":"the pagan crew who, caught in the storm, came to fear and worship the true God"}]},{"name":"Micah","author":"Micah","summary":"Micah prophesies against both Israel and Judah, condemning corrupt leaders, greedy landowners, and dishonest prophets who exploit the vulnerable. He warns of coming judgment, yet weaves in radiant promises of hope. He famously foretells that the Messiah will be born in Bethlehem and will shepherd His people. And he distills true religion into a single memorable line: to do justice, love mercy, and walk humbly with God.","verse":{"ref":"Micah 6:8","text":"Do justice, love kindness, and walk humbly with your God."},"point":"God will judge injustice and corruption, but He promises a Ruler from Bethlehem who will shepherd His people. What He requires is not empty ritual but justice, mercy, and humble fellowship with Him.","christ":"The ruler of Israel born in Bethlehem, who shepherds His people (5:2).","chars":[{"n":"Micah","d":"the prophet who exposed injustice, foretold the Messiah's birth in Bethlehem, and summed up true devotion to God"}]},{"name":"Nahum","author":"Nahum","summary":"Roughly a century after Nineveh repented under Jonah, the city has returned to its violence and idolatry. Nahum announces God's certain judgment on this cruel Assyrian empire that had terrorized the nations. He portrays God as slow to anger yet powerful and just, One who will not leave the guilty unpunished. For God's oppressed people, the message is comfort: the tyrant will fall.","verse":{"ref":"Nahum 1:7","text":"The Lord is good, a stronghold in the day of trouble."},"point":"God is patient, but He will surely bring justice on cruel, unrepentant oppressors. His judgment on evil is, for the oppressed, a message of comfort and hope.","christ":"The refuge and stronghold, whose feet bring good news of peace.","chars":[{"n":"Nahum","d":"the prophet who declared the certain downfall of the violent Assyrian empire"},{"n":"Nineveh","d":"the Assyrian capital, once spared, now condemned for returning to its cruelty and pride"}]},{"name":"Habakkuk","author":"Habakkuk","summary":"Habakkuk begins not by preaching to the people but by arguing with God. He asks why God tolerates the violence and injustice in Judah — and is stunned when God answers that He will use the even more wicked Babylonians as His instrument of judgment. Wrestling with this, the prophet takes his stand to watch and wait. God assures him that the righteous will live by faith and that justice will come, and Habakkuk ends in a soaring song of trust.","verse":{"ref":"Habakkuk 2:4","text":"The righteous shall live by his faith."},"point":"When God's ways are confusing and justice seems delayed, the righteous are called to live by faith. Trust in God's character and timing can produce worship even before the questions are resolved.","christ":"The righteous one by whose faith we live — the ground of justification in Christ (2:4).","chars":[{"n":"Habakkuk","d":"the questioning prophet who honestly voiced his doubts to God and moved from confusion to confident faith and worship"}]},{"name":"Zephaniah","author":"Zephaniah","summary":"Zephaniah proclaims the coming \"day of the Lord\" as a sweeping day of judgment against Judah and the surrounding nations for their idolatry and pride. He warns that no one will escape by wealth or status, and he calls the humble to seek the Lord. Yet the book turns from warning to joy: God will purify a faithful remnant. It ends with the tender image of God rejoicing over His restored people with singing.","verse":{"ref":"Zephaniah 3:17","text":"The Lord your God is in your midst… he will rejoice over you."},"point":"The day of the Lord brings judgment on sin and pride, sparing none who reject God. Yet beyond judgment lies joyful restoration, as God delights over a humble, purified remnant.","christ":"The King in our midst who saves and rejoices over His people with singing (3:17).","chars":[{"n":"Zephaniah","d":"the prophet who warned of the day of the Lord and promised joyful restoration for a faithful remnant"}]},{"name":"Haggai","author":"Haggai","summary":"The exiles have returned, but the temple still lies in ruins while the people busy themselves building their own comfortable homes. Through Haggai, God rebukes their misplaced priorities and calls them to \"consider your ways\" and rebuild His house. The people respond and take up the work, and God encourages them that the glory of this temple will surpass the former. The book is a bracing call to put God first.","verse":{"ref":"Haggai 2:4","text":"Be strong… for I am with you, declares the Lord."},"point":"God's people go wrong when they prioritize their own comfort over His purposes and worship. When they put Him first and take up His work, He promises His presence and blessing.","christ":"The desire of the nations, whose greater glory fills the temple (2:7).","chars":[{"n":"Haggai","d":"the prophet who stirred the discouraged returnees to rebuild the temple and reorder their priorities around God"},{"n":"Zerubbabel","d":"the governor who led the people in resuming the temple's construction"},{"n":"Joshua","d":"the high priest who, alongside Zerubbabel, led the rebuilding effort"}]},{"name":"Zechariah","author":"Zechariah","summary":"A contemporary of Haggai, Zechariah encourages the returned exiles to finish rebuilding the temple, but with a much wider lens. Through a series of vivid night visions he assures them of God's presence, protection, and future plans. Woven throughout are striking previews of the Messiah: the humble King coming on a donkey, and the shepherd sold for thirty pieces of silver and pierced. He points a struggling people beyond their present to God's coming King and kingdom.","verse":{"ref":"Zechariah 9:9","text":"Behold, your king is coming to you… humble and mounted on a donkey."},"point":"God encourages His people to finish His work by lifting their eyes to His future promises. Their hope rests in the coming Messiah — the humble King who will one day reign.","christ":"The humble King on a donkey (9:9), the pierced one (12:10), and the shepherd struck for the sheep (13:7).","chars":[{"n":"Zechariah","d":"the prophet who encouraged the temple's rebuilding through night visions and pointed vividly to the coming Messiah"},{"n":"Zerubbabel & Joshua","d":"the governor and high priest whom Zechariah encouraged in leading the restoration"}]},{"name":"Malachi","author":"Malachi","summary":"In the final book of the Old Testament, God confronts a spiritually complacent people generations after the return from exile. They offer blemished sacrifices, neglect their marriages and tithes, and grow cynical, questioning God's love and justice. Through a series of pointed dialogues, God calls them back to sincere worship and faithfulness. He promises to send a messenger — an Elijah figure — to prepare the way before the Messiah, then the record falls silent for four hundred years.","verse":{"ref":"Malachi 3:1","text":"Behold, I send my messenger, and he will prepare the way before me."},"point":"God is grieved by half-hearted, going-through-the-motions worship from His people. He calls them back to sincere devotion and promises a coming messenger to prepare the way for the Messiah.","christ":"The messenger of the covenant and the sun of righteousness who rises with healing (4:2).","chars":[{"n":"Malachi","d":"the last Old Testament prophet, who confronted spiritual apathy and promised the coming of a forerunner before the Messiah"}]}]}]},{"id":"nt","title":"New Testament","subtitle":"27 books — The coming of Christ and the birth of His church","groups":[{"name":"The Gospels","books":[{"name":"Matthew","author":"Matthew (Levi), the apostle and former tax collector","summary":"Written especially for a Jewish audience, Matthew presents Jesus as the long-awaited Messiah and King in the line of David and Abraham. It carefully shows how Jesus fulfills Old Testament prophecy at every turn, from His birth to His resurrection. The book gathers His teaching into five great discourses, including the Sermon on the Mount, and highlights the arrival of God's kingdom. It closes with the risen Jesus sending His disciples to make disciples of all nations.","verse":{"ref":"Matthew 28:19","text":"Go therefore and make disciples of all nations."},"point":"Jesus is the promised King-Messiah who fulfills all of Scripture's hopes and inaugurates God's kingdom. He now commissions His followers to carry His good news to the whole world.","christ":"Jesus the Messiah and King, the promised Son of David and Son of Abraham.","chars":[{"n":"Jesus","d":"presented as the Messiah, Son of David, and King, whose teaching, miracles, death, and resurrection fulfill the Scriptures"},{"n":"The twelve disciples","d":"the ordinary men Jesus called, taught, and sent out to carry on His mission"},{"n":"John the Baptist","d":"the prophet who prepared the way for Jesus and baptized Him at the start of His ministry"},{"n":"The Pharisees","d":"the religious leaders whose legalism and hostility repeatedly clashed with Jesus"}]},{"name":"Mark","author":"John Mark, associate of the apostle Peter","summary":"The shortest and most fast-paced Gospel, Mark presents Jesus as the powerful yet suffering Servant of God, always on the move. Its favorite word, \"immediately,\" drives the reader from one miracle and confrontation to the next. Written likely from Peter's eyewitness recollections, it emphasizes action over long discourse. The story builds relentlessly toward the cross, where the Servant gives His life as a ransom for many.","verse":{"ref":"Mark 10:45","text":"The Son of Man came not to be served but to serve."},"point":"Jesus is the mighty Servant-King who came not to be served but to serve. He conquers not by force but by giving His life as a ransom for many.","christ":"Jesus the suffering Servant who came to give His life as a ransom.","chars":[{"n":"Jesus","d":"portrayed as the active, powerful Servant of God who heals, casts out demons, and ultimately gives His life for others"},{"n":"Peter","d":"the leading apostle whose eyewitness memories likely lie behind this Gospel"},{"n":"The disciples","d":"Jesus' followers, often confused and slow to grasp who He truly was"}]},{"name":"Luke","author":"Luke, the physician and companion of Paul","summary":"Luke, a physician and careful historian, writes an orderly and detailed account of Jesus' life for a broad audience. His Gospel shines a spotlight on Jesus' compassion for the poor, the outcast, women, sinners, and the marginalized. It preserves beloved parables like the Good Samaritan and the Prodigal Son, along with rich accounts of Jesus' birth. Throughout, Jesus is the Savior who came to seek and to save the lost of every kind.","verse":{"ref":"Luke 19:10","text":"The Son of Man came to seek and to save the lost."},"point":"Jesus is the Savior for everyone, reaching out with compassion to the poor, the outcast, and the overlooked. No one is beyond the mercy of the One who came to seek and save the lost.","christ":"Jesus the Son of Man, Savior for the lost, the poor, and the outcast.","chars":[{"n":"Jesus","d":"the compassionate Son of Man and Savior who welcomed sinners, healed the hurting, and sought the lost"},{"n":"Mary","d":"the mother of Jesus, who responded to God's astonishing call with humble faith"},{"n":"Zechariah & Elizabeth","d":"the aged, faithful couple who became the parents of John the Baptist"},{"n":"John the Baptist","d":"the Spirit-filled forerunner who prepared people for the coming of the Lord"}]},{"name":"John","author":"John, the apostle (“the disciple whom Jesus loved”)","summary":"The most theological of the Gospels, John presents Jesus as the eternal Word made flesh — fully God and fully man. It is structured around seven miraculous \"signs\" and seven \"I am\" statements that reveal His identity, from \"I am the bread of life\" to \"I am the resurrection and the life.\" Long, intimate discourses unfold Jesus' relationship with the Father and His promise of the Spirit. John states his purpose plainly: that readers may believe Jesus is the Christ and have life in His name.","verse":{"ref":"John 3:16","text":"For God so loved the world, that he gave his only Son."},"point":"Jesus is the eternal Son of God who became flesh to reveal the Father and give eternal life. John writes so that we will believe in Him and, believing, truly live.","christ":"Jesus the eternal Son of God, the Word made flesh, full of grace and truth.","chars":[{"n":"Jesus","d":"revealed as the divine Word made flesh, the Son of God who gives eternal life to all who believe"},{"n":"Lazarus","d":"Jesus' friend, raised from the dead after four days as the climactic sign of His power over death"},{"n":"Thomas","d":"the disciple who doubted the resurrection until he saw Jesus and confessed, \"My Lord and my God\""},{"n":"Mary & Martha","d":"the devoted sisters of Lazarus and close friends of Jesus"}]}]},{"name":"Church History","books":[{"name":"Acts","author":"Luke, the physician","summary":"Luke's sequel picks up where his Gospel ends, chronicling the birth and explosive growth of the church. The risen Jesus ascends and pours out the Holy Spirit at Pentecost, empowering ordinary believers to witness boldly. The gospel spreads from Jerusalem outward — through Peter's ministry, Stephen's martyrdom, and especially Paul's missionary journeys — crossing ethnic and cultural barriers. By the end it has reached Rome, the heart of the empire, unstoppable.","verse":{"ref":"Acts 1:8","text":"You will be my witnesses… to the end of the earth."},"point":"The ascended Christ builds His church by the power of the Holy Spirit working through ordinary people. The gospel cannot be stopped as it spreads from Jerusalem to the ends of the earth.","christ":"The ascended, reigning Christ, at work by His Spirit through the church.","chars":[{"n":"Peter","d":"the apostle who preached the first Pentecost sermon and led the early church's explosive growth"},{"n":"Paul","d":"once a fierce persecutor, transformed into the tireless missionary who carried the gospel across the empire"},{"n":"Stephen","d":"a Spirit-filled servant who became the first Christian martyr, praying for his killers as he died"},{"n":"Barnabas","d":"the generous \"son of encouragement\" who championed both Paul and the mission to the Gentiles"}]}]},{"name":"Paul's Letters","books":[{"name":"Romans","author":"Paul the apostle","summary":"Paul's masterwork lays out the Christian gospel with sweeping clarity. He shows that all people, Jew and Gentile alike, are guilty before God, and that no one can be saved by their own effort. The good news is that God freely justifies sinners by grace through faith in Jesus Christ. Paul then unfolds the transformed life this gospel produces — freedom from sin, life in the Spirit, security in God's love — and how it should reshape the church and everyday relationships.","verse":{"ref":"Romans 1:16","text":"I am not ashamed of the gospel… the power of God for salvation."},"point":"Everyone stands guilty before God, and everyone is saved the same way — by grace through faith in Christ, not by works. This gospel not only rescues sinners but transforms how they live and love.","christ":"Christ our righteousness, in whom the ungodly are justified by faith.","chars":[{"n":"Paul","d":"the apostle who wrote this letter to systematically explain and defend the gospel of grace"},{"n":"Phoebe","d":"a servant of the church commended by Paul, who likely carried the letter to Rome"}]},{"name":"1 Corinthians","author":"Paul the apostle","summary":"Paul writes to a gifted but deeply troubled church struggling with division, immorality, and confusion. He addresses their quarrels over leaders, a case of scandalous sin, lawsuits among believers, questions about marriage, and abuses at the Lord's Supper. He gives extended teaching on spiritual gifts, insisting they be used in love — captured in the famous \"love chapter.\" He closes with a triumphant defense of the resurrection as the anchor of Christian hope.","verse":{"ref":"1 Corinthians 13:13","text":"Faith, hope, and love abide… but the greatest of these is love."},"point":"A church divided by pride and immaturity must be reordered around the way of love. Every gift and freedom finds its proper place only when love, grounded in Christ's resurrection, rules.","christ":"Christ our wisdom and the risen firstfruits who guarantees our resurrection (ch. 15).","chars":[{"n":"Paul","d":"the founding apostle who wrote to correct the Corinthians' divisions and disorder with the wisdom of the cross"},{"n":"The Corinthian believers","d":"a spiritually gifted but immature and quarrelsome church in need of correction"}]},{"name":"2 Corinthians","author":"Paul the apostle","summary":"In his most personal and emotional letter, Paul defends his ministry against critics who questioned his authority and sincerity. He speaks openly of his sufferings, weaknesses, and the \"thorn in the flesh\" through which God's power was made perfect. He urges the Corinthians toward reconciliation and generous giving for struggling believers. Throughout, he boasts not in strength but in weakness, so that the surpassing power belongs to God.","verse":{"ref":"2 Corinthians 12:9","text":"My power is made perfect in weakness."},"point":"True Christian ministry is marked not by impressive strength but by weakness through which God's power shines. God's grace is sufficient, and His power is made perfect in our weakness.","christ":"Christ who, though rich, became poor so that we might become rich.","chars":[{"n":"Paul","d":"the apostle who defended his ministry with vulnerable honesty, boasting only in his weakness and Christ's power"},{"n":"Titus","d":"Paul's trusted co-worker who ministered to the Corinthians and brought Paul encouraging news"},{"n":"T
