he “super-apostles”","d":"false teachers who challenged Paul's authority and misled the church"}]},{"name":"Galatians","author":"Paul the apostle","summary":"Alarmed that the Galatians are abandoning the true gospel, Paul writes a passionate, urgent defense of salvation by grace. Certain teachers were insisting that Gentile believers must keep the Jewish law — especially circumcision — to be saved. Paul argues fiercely that we are justified by faith in Christ alone, not by works of the law, and even recounts confronting Peter over the issue. He insists that Christ has set believers free, and that this freedom is meant to be lived out in love by the Spirit.","verse":{"ref":"Galatians 2:16","text":"A person is not justified by works of the law but through faith."},"point":"We are justified by faith in Christ alone, never by keeping the law or adding to His finished work. This gospel frees believers from bondage and empowers them to live by the Spirit.","christ":"Christ who redeemed us from the curse of the law and set us free (3:13).","chars":[{"n":"Paul","d":"the apostle who wrote passionately to defend the gospel of grace against those adding law-keeping"},{"n":"Peter","d":"publicly confronted by Paul for withdrawing from Gentile believers out of fear"},{"n":"The Judaizers","d":"teachers who insisted Gentiles must obey the Jewish law to be saved"}]},{"name":"Ephesians","author":"Paul the apostle (from prison)","summary":"Writing from prison, Paul unfolds God's grand, eternal plan to unite all things in Christ. The first half soars through the believer's spiritual riches — chosen, redeemed, forgiven, sealed with the Spirit, and made alive by grace. He marvels that Jews and Gentiles are now joined into one new people, the church, Christ's own body. The second half turns practical: how this new identity reshapes marriage, family, work, and the believer's stand against spiritual evil with the \"armor of God.\"","verse":{"ref":"Ephesians 2:8","text":"By grace you have been saved through faith… the gift of God."},"point":"God's eternal plan is to unite all things in Christ and to form one new people, the church, from every background. Those saved by grace are called to live worthy of that calling in every relationship.","christ":"Christ the head of the church, in whom God unites all things in heaven and earth.","chars":[{"n":"Paul","d":"the imprisoned apostle who wrote to reveal God's plan for the church and how believers should live it out"}]},{"name":"Philippians","author":"Paul the apostle (from prison)","summary":"Though writing from prison, Paul overflows with joy in this warm thank-you letter to a beloved church. He encourages the Philippians to rejoice in every circumstance and to pursue humility, holding up Christ's own self-emptying descent to the cross as the model. He shares his own contentment in Christ, whatever his situation, and his single-minded goal of knowing Him. The letter radiates gratitude, partnership, and steadfast joy amid hardship.","verse":{"ref":"Philippians 4:4","text":"Rejoice in the Lord always; again I will say, rejoice."},"point":"Joy in Christ is possible in any circumstance, even suffering and imprisonment, because it rests on Him and not on conditions. That joy grows as believers embrace the same humility Christ modeled.","christ":"Christ who humbled Himself to the cross and was exalted above every name (ch. 2).","chars":[{"n":"Paul","d":"the joyful prisoner who wrote to thank and encourage a beloved, generous church"},{"n":"Timothy","d":"Paul's faithful co-worker, held up as an example of genuine care for others"},{"n":"Epaphroditus","d":"the Philippian messenger who risked his life serving Paul and nearly died"}]},{"name":"Colossians","author":"Paul the apostle (from prison)","summary":"Paul writes to counter a dangerous mixture of false teaching threatening the Colossian church. Against every rival philosophy and religious add-on, he exalts the absolute supremacy and sufficiency of Christ — the image of the invisible God, the Creator and sustainer of all things, in whom all the fullness of God dwells. Because believers are complete in Him, they need nothing else added to His finished work. Paul then applies this to holy, thankful living in the home and community.","verse":{"ref":"Colossians 1:18","text":"That in everything he might be preeminent."},"point":"Christ is supreme over all creation and completely sufficient for salvation and life. Nothing needs to be added to Him, for in Him believers are already complete.","christ":"Christ supreme — the image of the invisible God, in whom all the fullness dwells.","chars":[{"n":"Paul","d":"the apostle who wrote to defend the supremacy and all-sufficiency of Christ against false teaching"},{"n":"Epaphras","d":"the faithful minister who founded the Colossian church and reported on it to Paul"},{"n":"Tychicus","d":"the trusted messenger who carried the letter and news to the church"}]},{"name":"1 Thessalonians","author":"Paul the apostle","summary":"Paul writes warmly to a young church he had to leave abruptly under persecution, relieved and thankful to hear they are standing firm. He encourages them to keep growing in holiness, brotherly love, and honest work amid opposition. He comforts those grieving believers who have died with the promise of Christ's return, when the dead in Christ will rise and all will be gathered to Him forever. The letter breathes hope and pastoral affection.","verse":{"ref":"1 Thessalonians 4:17","text":"And so we will always be with the Lord."},"point":"Believers are called to live holy, loving lives even under persecution as they await Christ's return. The certain hope of resurrection and reunion with the Lord comforts and steadies them.","christ":"Christ who will descend from heaven to gather His people to Himself.","chars":[{"n":"Paul","d":"the affectionate apostle who wrote to encourage and reassure a young, persecuted church"},{"n":"Timothy & Silas","d":"Paul's companions who helped plant the Thessalonian church and ministered alongside him"}]},{"name":"2 Thessalonians","author":"Paul the apostle","summary":"Some in Thessalonica had become confused or deceived into thinking the day of the Lord had already come, and a few had stopped working to idly await it. Paul writes to correct this, clarifying events that must precede Christ's return and reassuring them under ongoing persecution. He urges them to stand firm in the truth they were taught. And he plainly instructs the idle to get back to responsible work.","verse":{"ref":"2 Thessalonians 3:3","text":"The Lord is faithful. He will establish and guard you."},"point":"Christ will certainly return in glory, but believers must not be deceived about the timing or grow idle waiting. They are to stand firm in the truth and keep working faithfully.","christ":"Christ who will return in blazing glory to judge and to be glorified in His saints.","chars":[{"n":"Paul","d":"the apostle who wrote to correct end-times confusion and steady the persecuted church"},{"n":"The Thessalonian church","d":"believers enduring persecution who needed both encouragement and correction"}]},{"name":"1 Timothy","author":"Paul the apostle","summary":"Paul writes to his younger protégé Timothy, whom he left to lead the church at Ephesus. The letter serves as a pastoral handbook: confronting false teachers, guiding public worship and prayer, and setting out the qualifications for elders and deacons. Paul charges Timothy to guard sound doctrine and to set an example in speech and conduct despite his youth. Woven through it is a deep concern for the health, order, and integrity of the church.","verse":{"ref":"1 Timothy 4:12","text":"Set the believers an example in speech, conduct, love, and faith."},"point":"A healthy church depends on sound doctrine, godly leaders, and lives that match the gospel. Leaders are entrusted with guarding the truth and modeling it faithfully.","christ":"Christ the one mediator between God and men, who gave Himself as a ransom (2:5).","chars":[{"n":"Paul","d":"the seasoned apostle giving pastoral instruction to guide the church's leadership and life"},{"n":"Timothy","d":"Paul's young, sometimes timid protégé, charged with leading the Ephesian church faithfully"}]},{"name":"2 Timothy","author":"Paul the apostle","summary":"Facing execution in a Roman prison, Paul writes his final letter — a moving, personal charge to Timothy. He urges his beloved son in the faith to guard the gospel, endure hardship like a good soldier, and above all \"preach the word\" faithfully in a hostile age. He warns of difficult times and false teaching to come, pointing Timothy back to Scripture. With death near, Paul looks back with peace, having fought the good fight and finished the race.","verse":{"ref":"2 Timothy 4:7","text":"I have fought the good fight, I have finished the race."},"point":"No matter the cost, God's people must guard the gospel and preach His Word faithfully to the very end. Faithfulness under suffering, anchored in Scripture, is the calling of every believer.","christ":"Christ the righteous Judge who awards the crown to all who love His appearing (4:8).","chars":[{"n":"Paul","d":"the aged apostle, facing martyrdom, who wrote a final charge to remain faithful"},{"n":"Timothy","d":"Paul's cherished successor, urged to carry on the ministry courageously"}]},{"name":"Titus","author":"Paul the apostle","summary":"Paul writes to Titus, whom he left to organize the young and struggling churches on the island of Crete. He instructs Titus to appoint qualified elders in every town and to confront the false teachers and cultural vices undermining the faith. Sound doctrine, Paul insists, should always produce good works and godly living across every group in the church. God's saving grace itself trains believers to renounce sin and live upright, expectant lives.","verse":{"ref":"Titus 3:5","text":"He saved us… according to his own mercy."},"point":"Right belief and right living belong together — sound doctrine should always produce good works. God's grace not only saves but trains His people to live godly, ordered lives.","christ":"Christ our great God and Savior, who redeems and purifies a people for Himself (2:13–14).","chars":[{"n":"Paul","d":"the apostle who wrote to guide the organizing and strengthening of the Cretan churches"},{"n":"Titus","d":"Paul's capable representative charged with appointing leaders and establishing sound teaching on Crete"}]},{"name":"Philemon","author":"Paul the apostle","summary":"In this short, tender letter, Paul appeals to his friend Philemon on behalf of Onesimus, a slave who had run away and since become a Christian under Paul's ministry. Paul sends Onesimus back, urging Philemon to receive him not merely as a slave but as a beloved brother in Christ. He even offers to pay any debt Onesimus owes, echoing the gospel itself. It is a beautiful, personal picture of grace, forgiveness, and reconciliation.","verse":{"ref":"Philemon 1:16","text":"No longer as a bondservant but… as a beloved brother."},"point":"The gospel transforms relationships, turning even a runaway slave into a beloved brother. Grace calls believers to forgive, reconcile, and even absorb the cost, as Christ did for us.","christ":"Christ who takes our debt upon Himself — “charge it to me” — and reconciles.","chars":[{"n":"Paul","d":"the apostle who lovingly interceded for Onesimus and offered to cover his debt"},{"n":"Philemon","d":"the Christian slave owner and church host whom Paul asked to forgive and welcome Onesimus"},{"n":"Onesimus","d":"the runaway slave who became a believer and was sent back as a brother in Christ"}]}]},{"name":"The General Letters","books":[{"name":"Hebrews","author":"Anonymous (author unknown; traditionally linked to Paul)","summary":"Written to Jewish believers tempted to slip back into the old covenant, Hebrews argues powerfully that Christ is superior to everything that came before. He is greater than the angels, greater than Moses, and a better High Priest than the Levitical order — offering a single, final sacrifice that the old system only foreshadowed. Interwoven with the argument are urgent warnings not to drift away or fall back. It climaxes with the great \"hall of faith,\" calling readers to run their race looking to Jesus.","verse":{"ref":"Hebrews 12:2","text":"Looking to Jesus, the founder and perfecter of our faith."},"point":"Christ is superior to everything in the old covenant — its priests, sacrifices, and mediators — and He is God's final word. Therefore believers must hold fast to Him by faith and never turn back.","christ":"Christ our great High Priest, superior to angels, Moses, and every sacrifice.","chars":[{"n":"Jesus","d":"exalted as the great High Priest and the once-for-all sacrifice, superior to all that came before"},{"n":"The “hall of faith” heroes","d":"Abel, Noah, Abraham, Moses, and many others held up in chapter 11 as examples of enduring faith"}]},{"name":"James","author":"James, the brother of Jesus and leader of the Jerusalem church","summary":"James, the brother of Jesus, writes practical, hard-hitting wisdom for everyday Christian living, echoing the Sermon on the Mount. He insists that genuine faith proves itself in action — \"faith without works is dead.\" He tackles the taming of the tongue, favoritism toward the rich, the source of quarrels, and the danger of worldliness. Throughout, he calls believers to patient endurance and to a faith that shows up in how they actually live.","verse":{"ref":"James 2:17","text":"Faith by itself, if it does not have works, is dead."},"point":"Genuine faith is never merely words or belief; it proves itself in action and endurance. How we speak, treat others, and face trials reveals whether our faith is truly alive.","christ":"Christ the Lord of glory, whose wisdom from above we live out day by day.","chars":[{"n":"James","d":"the brother of Jesus and leader of the Jerusalem church, who wrote to call believers to a faith that works"}]},{"name":"1 Peter","author":"Peter the apostle","summary":"Peter writes to encourage Christians scattered across Asia Minor and suffering for their faith. He reminds these \"exiles\" of their living hope and secure inheritance in Christ, calling them to holy, honorable conduct even under mistreatment. Again and again he points to Christ's own unjust suffering as their example and hope. Trials, he assures them, are refining their faith and will give way to glory.","verse":{"ref":"1 Peter 5:10","text":"The God of all grace… will himself restore, confirm, and strengthen you."},"point":"Believers can stand firm and holy through suffering by fixing their hope on Christ and the glory to come. As they follow His example of patient suffering, their faith is refined like gold.","christ":"Christ the unblemished Lamb, our example in suffering and our living hope.","chars":[{"n":"Peter","d":"the apostle who wrote to strengthen persecuted believers with hope and the example of Christ's suffering"},{"n":"Silvanus (Silas)","d":"Peter's helper who assisted in writing and delivering the letter"}]},{"name":"2 Peter","author":"Peter the apostle","summary":"Knowing his death is near, Peter writes to warn the church against false teachers who deny the truth and twist grace into an excuse for immorality. He urges believers to grow in godly character and to remember the trustworthy testimony of Scripture. He confronts scoffers who mock the promise of Christ's return, explaining that God's apparent delay is patience, giving room for repentance. The day of the Lord will surely come.","verse":{"ref":"2 Peter 3:9","text":"The Lord is not slow… not wishing that any should perish."},"point":"Believers must guard against false teaching and keep growing in godliness. Christ's return is certain, and God's patience is meant to lead people to repentance.","christ":"Christ whose promised return is certain, the morning star rising in our hearts.","chars":[{"n":"Peter","d":"the apostle who, nearing death, warned the church against false teachers and affirmed Christ's certain return"}]},{"name":"1 John","author":"John, the apostle","summary":"John writes to give believers confidence that they truly know God and possess eternal life. He offers tests of genuine faith: walking in the light rather than in sin, loving fellow believers, and holding to the truth that Jesus is the Christ come in the flesh. He confronts early false teaching that denied Jesus' full humanity or downplayed sin. At the heart of it all is the assurance that \"God is love,\" and those born of Him will love as well.","verse":{"ref":"1 John 4:8","text":"God is love."},"point":"True faith shows itself in obedience, love for others, and sound belief about Jesus. Because God is love, His children are marked by love and can rest in the assurance of eternal life.","christ":"Christ our advocate with the Father and the propitiation for our sins (2:1–2).","chars":[{"n":"John","d":"the aged apostle who wrote to assure believers of eternal life and to test the genuineness of their faith"}]},{"name":"2 John","author":"John, the apostle (“the elder”)","summary":"In this brief personal note, John writes to a church (addressed as \"the elect lady\") urging them to continue walking in both love and truth. He warns them to be on guard against traveling deceivers who deny that Jesus came in the flesh. Such false teachers, he says, should not be welcomed or supported. Love and truth, John insists, must never be separated.","verse":{"ref":"2 John 1:6","text":"This is love, that we walk according to his commandments."},"point":"Believers are to walk in love and truth together, never sacrificing one for the other. Guarding the truth means refusing to support those who deny Christ.","christ":"Christ come in the flesh — the truth in which we are called to walk.","chars":[{"n":"John","d":"the elder who wrote a short, warm warning to walk in truth and resist deceivers"},{"n":"“The elect lady”","d":"the church (or possibly an individual woman) to whom the letter is addressed"}]},{"name":"3 John","author":"John, the apostle (“the elder”)","summary":"John writes a personal note commending a faithful believer named Gaius for his hospitality to traveling gospel workers. He contrasts Gaius with Diotrephes, a proud, domineering church figure who rejects John's authority and turns others away. He also commends Demetrius, who has a good reputation among all. The letter champions supporting genuine ministry and shunning arrogant, self-serving leadership.","verse":{"ref":"3 John 1:11","text":"Whoever does good is from God."},"point":"God's people should generously support faithful gospel workers and imitate what is good. Arrogant, controlling leadership has no place in Christ's church.","christ":"Christ, “the Name,” for whose sake His servants go out into the world (v. 7).","chars":[{"n":"Gaius","d":"a beloved believer commended for his faithful hospitality to traveling missionaries"},{"n":"Diotrephes","d":"a proud church figure rebuked for his arrogance, gossip, and rejection of others"},{"n":"Demetrius","d":"a believer praised for his good reputation and testimony"}]},{"name":"Jude","author":"Jude, the brother of James and of Jesus","summary":"Jude, another brother of Jesus, had intended to write about salvation but urgently changed course to warn the church about false teachers who had crept in. These ungodly infiltrators twisted God's grace into a license for immorality and denied the Lord. Drawing on vivid examples of past judgment, Jude calls believers to \"contend for the faith\" and to build themselves up, keep in God's love, and rescue the wavering. He ends with a soaring doxology to the God who is able to keep them from stumbling.","verse":{"ref":"Jude 1:3","text":"Contend for the faith once for all delivered to the saints."},"point":"Believers must actively contend for the true faith against those who distort grace into license. Even as they resist error, God is able to keep them from falling and present them blameless.","christ":"Christ who is able to keep us from stumbling and present us blameless with great joy.","chars":[{"n":"Jude","d":"the brother of James and of Jesus, who urgently called believers to defend the faith against false teachers"}]}]},{"name":"Prophecy","books":[{"name":"Revelation","author":"John, the apostle (from exile on Patmos)","summary":"Exiled on the island of Patmos, John receives a sweeping apocalyptic vision of the risen, glorified Christ and the future. Through vivid symbols, letters to seven churches, and cycles of judgment, the book unveils the cosmic conflict between God and evil and assures believers of Christ's ultimate triumph. Despite persecution and the raging of the dragon, the Lamb who was slain reigns victorious. It ends with the defeat of evil and a glorious new heaven and new earth, where God dwells forever with His people.","verse":{"ref":"Revelation 21:5","text":"Behold, I am making all things new."},"point":"Jesus wins. Despite present suffering and the fury of evil, Christ will judge sin, defeat death, and make all things new — dwelling forever with His people in a renewed creation.","christ":"Christ the victorious Lamb and returning King, the Alpha and the Omega, who makes all things new.","chars":[{"n":"Jesus","d":"revealed as the victorious, reigning Lamb and returning King, the Alpha and the Omega"},{"n":"John","d":"the exiled apostle who received and recorded the visions for the churches"},{"n":"The seven churches","d":"real congregations in Asia Minor addressed with Christ's praise, warning, and encouragement"},{"n":"The dragon","d":"Satan, the great enemy of God and His people, finally and fully defeated"}]}]}]}],"timeline":[{"date":"Before c. 2000 BC","era":"Primeval History","desc":"Genesis 1–11 — creation, the fall, the flood, and the tower of Babel."},{"date":"c. 2000–1700 BC","era":"The Patriarchs","desc":"Genesis 12–50 — Abraham, Isaac, Jacob, and Joseph; the family of promise moves to Egypt. Job is also set in this era."},{"date":"c. 1500–1400 BC","era":"Exodus & Wilderness","desc":"Exodus, Leviticus, Numbers, Deuteronomy — rescue from Egypt, the Law at Sinai, and forty years of wandering. (Some scholars date the Exodus later, c. 1300–1250 BC.)"},{"date":"c. 1400–1050 BC","era":"Conquest & Judges","desc":"Joshua — entering and conquering Canaan. Judges and Ruth — the cycle of sin and deliverers, and Ruth's quiet redemption."},{"date":"c. 1050–930 BC","era":"The United Kingdom","desc":"1 & 2 Samuel, 1 Kings 1–11, 1 Chronicles, 2 Chronicles 1–9 — Saul, David, and Solomon; the temple is built. Psalms, Proverbs, Ecclesiastes, and Song of Solomon come largely from David and Solomon."},{"date":"c. 930–586 BC","era":"The Divided Kingdom","desc":"1 Kings 12 – 2 Kings and 2 Chronicles 10–36 — Israel (north) and Judah (south) drift into idolatry. Most prophets preach in this era: Isaiah, Jeremiah, Hosea, Joel, Amos, Obadiah, Jonah, Micah, Nahum, Habakkuk, and Zephaniah."},{"date":"586–539 BC","era":"The Exile","desc":"2 Kings 25 and Lamentations — Jerusalem falls and is mourned. Ezekiel and Daniel prophesy among the exiles in Babylon."},{"date":"539–430 BC","era":"The Return","desc":"Ezra and Nehemiah — rebuilding the temple and the walls. Esther — God's providence protecting Jews still in Persia. Haggai, Zechariah, and Malachi — the post-exile prophets; Malachi closes the Old Testament."},{"date":"c. 430–4 BC","era":"The 400 Silent Years","desc":"No Scripture is written during this gap between the Testaments; the stage is set for the coming of the Messiah."},{"date":"c. 4 BC – AD 30","era":"The Life of Christ","desc":"Matthew, Mark, Luke, and John — the birth, ministry, death, and resurrection of Jesus."},{"date":"c. AD 30–62","era":"The Early Church","desc":"Acts — the church is born at Pentecost and spreads from Jerusalem to Rome."},{"date":"c. AD 48–68","era":"Paul's Letters","desc":"Galatians, 1–2 Thessalonians, 1–2 Corinthians, and Romans, then the prison letters (Ephesians, Philippians, Colossians, Philemon) and the pastoral letters (1–2 Timothy, Titus)."},{"date":"c. AD 45–90","era":"The General Letters","desc":"James, Hebrews, 1–2 Peter, 1–2–3 John, and Jude — written to encourage and warn scattered believers."},{"date":"c. AD 95","era":"Prophecy","desc":"Revelation — John's visions of Christ's victory and the new creation close the New Testament."}]};

/* ---------- persistence (safe) ---------- */
const store = {
  get(k,f){ try{ const v=localStorage.getItem('bbb.'+k); return v==null?f:JSON.parse(v);}catch(e){return f;} },
  set(k,v){ try{ localStorage.setItem('bbb.'+k, JSON.stringify(v)); }catch(e){} }
};
let read  = new Set(store.get('read',  []));
let saved = new Set(store.get('saved', []));
let openGroups = new Set(store.get('groups', []));
let view   = store.get('view','books'); if(!['books','timeline','christ'].includes(view)) view='books';
let filter = store.get('filter','all');
let lastBook = store.get('lastBook', null);
let remind = store.get('remind','none');
let lastBackup = store.get('lastBackup', null);
let remindSet = store.get('remindSet', null);
let remindSnooze = store.get('remindSnooze', null);
const saveState = ()=>{ store.set('read',[...read]); store.set('saved',[...saved]);
  store.set('groups',[...openGroups]); store.set('view',view); store.set('filter',filter); store.set('lastBook',lastBook); };

const TOTAL = DATA.testaments.reduce((a,t)=>a+t.groups.reduce((b,g)=>b+g.books.length,0),0);
const allBooks = [];
DATA.testaments.forEach(t=>t.groups.forEach(g=>g.books.forEach(b=>allBooks.push(Object.assign({_t:t.id,_g:g.name},b)))));
const bookIndex = Object.fromEntries(allBooks.map((b,i)=>[b.name,i]));

/* ---------- helpers ---------- */
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);

function updateProgress(){
  const n = read.size;
  $('#barFill').style.width = (n/TOTAL*100)+'%';
  $('#progText').textContent = n+' of '+TOTAL+' read';
}

/* ---------- book detail markup ---------- */
function detailHTML(b){
  const chars = b.chars.map(c=>`<li><b>${esc(c.n)}</b> — ${esc(c.d)}.</li>`).join('');
  const isRead = read.has(b.name), isSaved = saved.has(b.name);
  const i = bookIndex[b.name];
  const prev = allBooks[i-1], next = allBooks[i+1];
  return `<div class="bpad">
    <p class="author"><b>Author:</b> ${esc(b.author)}</p>
    <p class="summary">${esc(b.summary)}</p>
    <div class="verse"><span class="q">&ldquo;${esc(b.verse.text)}&rdquo;</span><span class="ref">${esc(b.verse.ref)}</span></div>
    <div class="block"><p class="lab">Key point</p><p>${esc(b.point)}</p></div>
    <div class="block"><p class="lab">Christ in this book</p><p>${esc(b.christ)}</p></div>
    <p class="lab">Primary characters</p>
    <ul class="chars">${chars}</ul>
    <div class="actions">
      <button class="mark ${isRead?'act':''}" data-book="${esc(b.name)}">${isRead?'&#10003; Read':'Mark as read'}</button>
      <button class="save ${isSaved?'act':''}" data-book="${esc(b.name)}">${isSaved?'&#9873; Saved':'&#9872; Save'}</button>
    </div>
    <div class="navbtns">
      <button class="jump" data-to="${prev?esc(prev.name):''}" ${prev?'':'disabled'}>&#8249; ${prev?esc(prev.name):''}</button>
      <button class="jump" data-to="${next?esc(next.name):''}" ${next?'':'disabled'}>${next?esc(next.name):''} &#8250;</button>
    </div>
  </div>`;
}

function bookRow(b){
  const isRead = read.has(b.name), isSaved = saved.has(b.name);
  return `<div class="book ${isRead?'read':''}" data-name="${esc(b.name)}">
    <button class="brow">
      <span class="bname">${esc(b.name)}</span>
      ${isSaved?'<span class="badge rib">&#9873;</span>':''}
      ${isRead?'<span class="badge rd">&#10003;</span>':''}
      <span class="chev">&#9656;</span>
    </button>
    <div class="bdetail">${detailHTML(b)}</div>
  </div>`;
}

/* ---------- render books view ---------- */
function groupDone(g){ return g.books.every(b=>read.has(b.name)); }

function renderBooks(){
  const q = ($('#q').value||'').trim().toLowerCase();
  const host = $('#view-books');

  // filtered flat search
  if(q){
    const hits = allBooks.filter(b=>{
      if(filter==='ot'&&b._t!=='ot')return false;
      if(filter==='nt'&&b._t!=='nt')return false;
      if(filter==='saved'&&!saved.has(b.name))return false;
      if(filter==='unread'&&read.has(b.name))return false;
      const hay = (b.name+' '+b.author+' '+b.summary+' '+b.point+' '+b.christ+' '+b.chars.map(c=>c.n+' '+c.d).join(' ')).toLowerCase();
      return hay.includes(q);
    });
    host.innerHTML = hits.length
      ? `<div class="tlabel">Results (${hits.length})</div>` + hits.map(bookRow).join('')
      : `<div class="empty"><div class="big">No matches</div>Try a name like &ldquo;David,&rdquo; a book, or a theme.</div>`;
    wireBooks();
    return;
  }

  let html='';
  DATA.testaments.forEach(t=>{
    if(filter==='ot'&&t.id!=='ot')return;
    if(filter==='nt'&&t.id!=='nt')return;
    let tHTML='';
    t.groups.forEach(g=>{
      let books = g.books;
      if(filter==='saved') books = books.filter(b=>saved.has(b.name));
      if(filter==='unread')books = books.filter(b=>!read.has(b.name));
      if(!books.length) return;
      const gid = t.id+'::'+g.name;
      const isOpen = openGroups.has(gid);
      const rc = g.books.filter(b=>read.has(b.name)).length;
      tHTML += `<div class="group ${isOpen?'open':''} ${groupDone(g)?'done':''}" data-gid="${esc(gid)}">
        <button class="ghead">
          <span class="gdot"></span>
          <span class="gname">${esc(g.name)}</span>
          <span class="gmeta">${rc}/${g.books.length}</span>
          <span class="chev">&#9656;</span>
        </button>
        <div class="gbody">${books.map(bookRow).join('')}</div>
      </div>`;
    });
    if(tHTML){
      html += `<div class="tlabel">${esc(t.title)}</div><div class="tsub">${esc(t.subtitle)}</div>`+tHTML;
    }
  });
  host.innerHTML = html || `<div class="empty"><div class="big">Nothing here yet</div>${filter==='saved'?'Save a book with the ribbon to see it here.':'No unread books — well done.'}</div>`;
  wireBooks();
}

/* ---------- interactions ---------- */
function openBook(el){
  document.querySelectorAll('.book.open').forEach(o=>{ if(o!==el) o.classList.remove('open'); });
  const willOpen = !el.classList.contains('open');
  el.classList.toggle('open', willOpen);
  if(willOpen){
    lastBook = el.dataset.name; saveState();
    setTimeout(()=>{ el.scrollIntoView({behavior:'smooth',block:'start'}); },60);
  }
}

function wireBooks(){
  document.querySelectorAll('.group .ghead').forEach(h=>{
    h.onclick=()=>{ const g=h.closest('.group'); const gid=g.dataset.gid;
      g.classList.toggle('open');
      if(g.classList.contains('open')) openGroups.add(gid); else openGroups.delete(gid);
      saveState(); };
  });
  document.querySelectorAll('.book .brow').forEach(r=>{
    r.onclick=()=>openBook(r.closest('.book'));
  });
  document.querySelectorAll('.mark').forEach(btn=>{
    btn.onclick=e=>{ e.stopPropagation(); const n=btn.dataset.book;
      if(read.has(n))read.delete(n); else read.add(n);
      saveState(); updateProgress(); refreshBook(n); };
  });
  document.querySelectorAll('.save').forEach(btn=>{
    btn.onclick=e=>{ e.stopPropagation(); const n=btn.dataset.book;
      if(saved.has(n))saved.delete(n); else saved.add(n);
      saveState(); refreshBook(n); };
  });
  document.querySelectorAll('.jump').forEach(btn=>{
    btn.onclick=e=>{ e.stopPropagation(); const to=btn.dataset.to; if(to) goToBook(to); };
  });
}

// re-render a single open book's row (keep it open) after read/save toggle
function refreshBook(name){
  const el = document.querySelector('.book[data-name="'+cssq(name)+'"]');
  if(!el) { renderBooks(); return; }
  const b = allBooks[bookIndex[name]];
  const wasOpen = el.classList.contains('open');
  el.className = 'book '+(read.has(name)?'read ':'')+(wasOpen?'open':'');
  el.querySelector('.brow').outerHTML = bookRow(b).match(/<button class="brow">[\s\S]*?<\/button>/)[0];
  el.querySelector('.bdetail').innerHTML = detailHTML(b);
  // update group meta/dot
  document.querySelectorAll('.group').forEach(g=>{
    const gid=g.dataset.gid; if(!gid) return;
    const grp = DATA.testaments.flatMap(t=>t.groups.map(x=>({id:t.id+'::'+x.name,g:x}))).find(o=>o.id===gid);
    if(grp){ const rc=grp.g.books.filter(x=>read.has(x.name)).length;
      const meta=g.querySelector('.gmeta'); if(meta)meta.textContent=rc+'/'+grp.g.books.length;
      g.classList.toggle('done', grp.g.books.every(x=>read.has(x.name))); }
  });
  wireBooks();
}
function cssq(s){ return s.replace(/"/g,'\\"'); }

function goToBook(name){
  const b = allBooks[bookIndex[name]];
  if(view!=='books'){ setView('books'); }
  $('#q').value=''; $('#searchRow').classList.remove('has');
  // ensure its group is open
  openGroups.add(b._t+'::'+b._g); saveState();
  renderBooks();
  const el = document.querySelector('.book[data-name="'+cssq(name)+'"]');
  if(el){ openBook(el); }
}

function reminderDue(){ if(remind==='none') return false; const base=Math.max(lastBackup||0, remindSnooze||0, remindSet||0); if(!base) return false; return (Date.now()-base) >= RINT[remind]; }

function exportBackup(){
  const payload = JSON.stringify({ app:'book-by-book', v:1, exported:new Date().toISOString(),
    read:[...read], saved:[...saved] }, null, 2);
  try{
    const blob = new Blob([payload], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='book-by-book-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }catch(e){
    // fallback: open as data URL so it can be saved/shared
    window.location.href = 'data:application/json;charset=utf-8,'+encodeURIComponent(payload);
  }
  markBackedUp();
}
function importBackup(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      if(!o || (!Array.isArray(o.read) && !Array.isArray(o.saved))) throw 0;
      const valid = new Set(allBooks.map(b=>b.name));
      read  = new Set((o.read ||[]).filter(n=>valid.has(n)));
      saved = new Set((o.saved||[]).filter(n=>valid.has(n)));
      saveState(); updateProgress(); renderBooks(); renderSettings();
      alert('Backup restored — '+read.size+' read, '+saved.size+' saved.');
    }catch(e){
      alert('Sorry, that file could not be read as a Book by Book backup.');
    }
  };
  r.readAsText(file);
}
